name: Publish Todo API
on:
  push:
    branches: [main]
    paths:
      - services/todo-api/**
      - .github/workflows/publish-todo-api.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ocir-publish
    env:
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/todo-api/package-lock.json
      - working-directory: services/todo-api
        run: |
          npm ci
          npm test
          npm run lint
      - name: Validate registry configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_REGISTRY"
          test -n "$OCI_TENANCY_NAMESPACE"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_AUTH_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/todo-api
          push: true
          tags: ${{ env.OCI_REGISTRY }}/${{ env.OCI_TENANCY_NAMESPACE }}/oke-openspec-codex/todo-api:${{ github.sha }}
