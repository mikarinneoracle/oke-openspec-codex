name: Publish Todo UI

on:
  push:
    branches:
      - main
    paths:
      - apps/todo-db-app/**
      - .github/workflows/publish-todo-ui.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish immutable UI release
    runs-on: ubuntu-latest
    environment: ui-publish
    env:
      OCI_TODO_UI_WRITE_PAR_URL: ${{ secrets.OCI_TODO_UI_WRITE_PAR_URL }}
      RELEASE_PREFIX: releases/${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/todo-db-app/package-lock.json

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_TODO_UI_WRITE_PAR_URL"

      - name: Build and lint UI
        working-directory: apps/todo-db-app
        run: |
          npm ci
          npm run lint
          npm run build
          tar -C dist -czf todo-ui-release.tar.gz .

      - name: Upload release through write-only PAR
        shell: bash
        working-directory: apps/todo-db-app
        run: |
          set -euo pipefail
          find dist -type f -print0 | while IFS= read -r -d '' artifact; do
            relative_path="${artifact#dist/}"
            content_type="$(file --brief --mime-type "$artifact")"
            cache_control='public, max-age=31536000, immutable'
            if [ "$relative_path" = 'index.html' ]; then
              cache_control='no-cache'
            fi
            curl --fail --silent --show-error --retry 3 \
              --upload-file "$artifact" \
              --header "Content-Type: $content_type" \
              --header "Cache-Control: $cache_control" \
              "${OCI_TODO_UI_WRITE_PAR_URL}${RELEASE_PREFIX}/${relative_path}"
          done
          curl --fail --silent --show-error --retry 3 \
            --upload-file todo-ui-release.tar.gz \
            --header 'Content-Type: application/gzip' \
            --header 'Cache-Control: public, max-age=31536000, immutable' \
            "${OCI_TODO_UI_WRITE_PAR_URL}${RELEASE_PREFIX}/bundle.tar.gz"

      - name: Publish release summary
        shell: bash
        run: |
          {
            echo '## Todo UI release published'
            echo
            echo "- Release prefix: \`$RELEASE_PREFIX/\`"
            echo "- Demo bridge archive: \`$RELEASE_PREFIX/bundle.tar.gz\`"
            echo '- API path: `/api` through the same-origin Envoy Gateway route'
          } >> "$GITHUB_STEP_SUMMARY"
