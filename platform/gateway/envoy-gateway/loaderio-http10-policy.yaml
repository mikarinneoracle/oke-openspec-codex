apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: loaderio-http10-demo
  namespace: envoy-gateway-system
spec:
  # Loader.io's HTTP target can issue HTTP/1.0 requests. Enable that protocol
  # only on this temporary, public HTTP demo listener and inject its explicit
  # IP hostname when the request lacks Host.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
      sectionName: http
  http1:
    http10:
      useDefaultHost: true
