apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 10m0s
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    certgen:
      job:
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
    deployment:
      pod:
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
