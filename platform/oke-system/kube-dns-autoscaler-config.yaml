apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-dns-autoscaler
  namespace: kube-system
data:
  # This demo retains one managed system node. Keep one CoreDNS replica for up
  # to five cluster nodes so DNS does not create Karpenter workload demand.
  linear: |-
    {
      "nodesPerReplica": 5,
      "preventSinglePointFailure": true,
      "min": 1
    }
