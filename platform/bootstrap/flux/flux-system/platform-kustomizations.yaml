---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./platform/gateway/envoy-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./platform/crossplane
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./platform/external-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karpenter-core
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
  interval: 1m0s
  path: ./platform/karpenter/core
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: karpenter-capacity
  namespace: flux-system
spec:
  dependsOn:
    - name: karpenter-core
  interval: 1m0s
  path: ./platform/karpenter/capacity
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: todo-foundation
  namespace: flux-system
spec:
  dependsOn:
    - name: crossplane
    - name: external-secrets
  interval: 1m0s
  path: ./platform/tenants/todo/foundation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: todo-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
    - name: todo-foundation
  interval: 1m0s
  path: ./platform/tenants/todo/secrets
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: todo-database
  namespace: flux-system
spec:
  dependsOn:
    - name: todo-secrets
  interval: 1m0s
  path: ./platform/tenants/todo/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
