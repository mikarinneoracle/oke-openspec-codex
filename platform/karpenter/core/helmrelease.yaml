apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karpenter
  namespace: karpenter
spec:
  interval: 10m0s
  chart:
    spec:
      chart: karpenter
      version: 1.3.0
      sourceRef:
        kind: HelmRepository
        name: karpenter-provider-oci
        namespace: karpenter
      interval: 1h0m0s
  install:
    createNamespace: true
  values:
    # Temporarily raise KPO controller detail while diagnosing worker-node
    # registration. Revert to `info` once the probe node has joined.
    logLevel: debug
    replicaCount: 1
    serviceAccount:
      name: karpenter
    controller:
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
          ephemeral-storage: 512Mi
        limits:
          cpu: 1
          memory: 1Gi
          ephemeral-storage: 1Gi
    nodeSelector:
      node-role/system: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    settings:
      clusterCompartmentId: ocid1.compartment.oc1..aaaaaaaawccfklp2wj4c5ymigrkjfdhcbcm3u5ripl2whnznhmvgiqdatqgq
      vcnCompartmentId: ocid1.compartment.oc1..aaaaaaaawccfklp2wj4c5ymigrkjfdhcbcm3u5ripl2whnznhmvgiqdatqgq
      # KPO passes this value straight to /etc/oke/oke-install.sh. The
      # documented value is the private endpoint IP; the bootstrap script owns
      # the Kubernetes API port.
      apiserverEndpoint: 10.42.0.12
      ociVcnIpNative: true
      ipFamilies:
        - IPv4
