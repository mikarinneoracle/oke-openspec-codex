apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-registration-probe
  namespace: karpenter
  labels:
    app.kubernetes.io/name: karpenter-registration-probe
    app.kubernetes.io/part-of: oke-openspec-codex-debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter-registration-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter-registration-probe
    spec:
      # The label is applied only to nodes provisioned by todo-workload.
      nodeSelector:
        workload.oke-openspec-codex.io/tier: application
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 32Mi
