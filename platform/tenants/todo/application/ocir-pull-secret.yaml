# This ClusterSecretStore is cluster-scoped solely so the Todo API namespace can
# use the existing, tightly scoped ESO Workload Identity in crossplane-system.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: todo-runtime-vault
  labels:
    app.kubernetes.io/part-of: todo-db-app
    app.kubernetes.io/component: secrets
spec:
  provider:
    oracle:
      principalType: Workload
      region: eu-frankfurt-1
      serviceAccountRef:
        name: todo-vault-reader
        namespace: crossplane-system
      vault: ocid1.vault.oc1.eu-frankfurt-1.cbrcv4plaahh4.abtheljrz3llvhibeprbk3pp5si7vznjxvmplux3xly5rgipubkvhgvav34a
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todo-ocir-pull
  namespace: todo-app
  labels:
    app.kubernetes.io/part-of: todo-db-app
    app.kubernetes.io/component: api-image
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: todo-runtime-vault
  target:
    creationPolicy: Owner
    deletionPolicy: Delete
    name: todo-ocir-pull
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: oke-openspec-codex-todo-ocir-pull
