apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-ui-bridge-nginx
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-ui-bridge
    app.kubernetes.io/part-of: todo-db-app
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /health/live {
        access_log off;
        return 200;
      }

      # Temporary Loader.io target-host verification. This exact response must
      # not be handled by the SPA fallback; remove it after load testing.
      location = /loaderio-38fbc25a47ee54b9a37fbe3365b71030.txt {
        default_type text/plain;
        return 200 "loaderio-38fbc25a47ee54b9a37fbe3365b71030";
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-ui-bridge
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-ui-bridge
    app.kubernetes.io/part-of: todo-db-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-ui-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-ui-bridge
        app.kubernetes.io/part-of: todo-db-app
      # ConfigMap volumes mounted with subPath do not update in place. Change
      # this checksum whenever the Nginx configuration changes to roll pods.
      annotations:
        checksum/todo-ui-bridge-nginx: "3c65b3b45d27545c4255d1f8e5771798a78af5024f2aadd1f6db48661351f807"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-release
          image: busybox:1.36.1-musl
          command:
            - sh
            - -ec
            - |
              wget -q -O /work/bundle.tar.gz "$UI_RELEASE_BUNDLE_URL"
              tar -xzf /work/bundle.tar.gz -C /work
              test -f /work/index.html
              rm /work/bundle.tar.gz
          env:
            - name: UI_RELEASE_BUNDLE_URL
              value: https://objectstorage.eu-frankfurt-1.oraclecloud.com/n/frsxwtjslf35/b/oke-openspec-codex-todo-ui/o/releases/92d5209b1731d90f94021a2aa2ba23f48f53dad9/bundle.tar.gz
          volumeMounts:
            - name: ui-files
              mountPath: /work
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      containers:
        - name: nginx
          # OKE's CRI-O enforces fully-qualified image names for Docker Hub.
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: ui-files
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
      volumes:
        - name: nginx-config
          configMap:
            name: todo-ui-bridge-nginx
        - name: ui-files
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: todo-ui-bridge
  namespace: todo-app
  labels:
    app.kubernetes.io/name: todo-ui-bridge
    app.kubernetes.io/part-of: todo-db-app
spec:
  selector:
    app.kubernetes.io/name: todo-ui-bridge
  ports:
    - name: http
      port: 80
      targetPort: http
