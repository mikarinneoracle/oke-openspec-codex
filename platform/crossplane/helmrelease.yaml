apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  interval: 10m0s
  chart:
    spec:
      chart: crossplane
      version: 2.4.0
      sourceRef:
        kind: HelmRepository
        name: crossplane-stable
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
    rbacManager:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
